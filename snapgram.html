<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snapgram</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#737373;--line:#e6e6e6;--card:#fafafa;--accent:#e1306c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f5;--mut:#a0a0a0;--line:#262626;--card:#121212;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f5;--mut:#a0a0a0;--line:#262626;--card:#121212;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#root{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:64px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.logo{font:italic 700 26px Georgia,"Times New Roman",serif}
.stories{display:flex;gap:12px;padding:12px 14px;overflow-x:auto;border-bottom:1px solid var(--line)}
.story{display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;flex:none;font-size:12px}
.ring{padding:3px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf)}
.ring.seen{background:var(--line)}
.ring>div{border:2px solid var(--bg);border-radius:50%}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.post{padding-bottom:6px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:600}
.img{width:100%;aspect-ratio:1;display:block;background:var(--card);position:relative;user-select:none}
.img img{width:100%;height:100%;display:block}
.pop{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;animation:pop .7s forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1)}}
.acts{display:flex;align-items:center;gap:14px;padding:10px 14px 4px}
.acts .sp{flex:1}
.pad{padding:0 14px}
.mut{color:var(--mut)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding:10px 0}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:75vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet h3{margin:0;padding:14px;text-align:center;border-bottom:1px solid var(--line);font-size:15px}
.list{overflow-y:auto;padding:12px 14px;flex:1}
.cm{display:flex;gap:10px;margin-bottom:12px}
.row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
input,textarea{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:9px 14px;outline:0}
textarea{border-radius:12px;width:100%;resize:none}
.btn{background:#0095f6;color:#fff;font-weight:600;border-radius:8px;padding:8px 16px}
.btn.alt{background:var(--line);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid button{aspect-ratio:1;display:block}
.grid img{width:100%;height:100%;display:block}
.stats{display:flex;justify-content:space-around;text-align:center;flex:1}
.stats b{display:block;font-size:17px}
.tabs{display:flex;border-top:1px solid var(--line);margin-top:12px}
.tabs button{flex:1;padding:10px;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-color:var(--fg)}
.viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;justify-content:center}
.vin{position:relative;width:100%;max-width:480px;height:100%;color:#fff}
.vin img{width:100%;height:100%;object-fit:cover}
.bars{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:4px}
.bars i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.bars i b{display:block;height:100%;background:#fff}
.bars i.on b{animation:fill 4s linear forwards}
@keyframes fill{from{width:0}to{width:100%}}
.vh{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;align-items:center;gap:10px;font-weight:600;text-shadow:0 1px 3px #0008}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#262626;color:#fff;padding:10px 18px;border-radius:20px;z-index:40;font-size:14px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px}
.swatches button{border-radius:8px;overflow:hidden;border:3px solid transparent;aspect-ratio:1}
.swatches button.on{border-color:#0095f6}
.swatches img{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ---------- 1. SAMPLE DATA ---------- */
// Makes a colourful picture from a number (no internet needed).
function photo(i) {
  const h = (i * 47) % 360, h2 = (h + 60) % 360, k = i % 3;
  const shapes = k === 0
    ? `<circle cx="300" cy="320" r="130" fill="hsla(${h2},90%,75%,.8)"/><rect x="40" y="400" width="520" height="200" fill="hsla(${h},60%,25%,.6)"/>`
    : k === 1
    ? `<polygon points="0,600 220,260 380,480 480,360 600,600" fill="hsla(${h},50%,20%,.7)"/><circle cx="440" cy="170" r="70" fill="hsla(${h2},100%,85%,.9)"/>`
    : `<circle cx="200" cy="200" r="160" fill="hsla(${h2},80%,70%,.6)"/><circle cx="400" cy="400" r="190" fill="hsla(${h},80%,60%,.6)"/>`;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 600'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${h},80%,60%)'/><stop offset='1' stop-color='hsl(${h2},80%,40%)'/></linearGradient></defs><rect width='600' height='600' fill='url(#g)'/>${shapes}</svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

const USERS = [
  { id: "you", name: "you", full: "Your Name", hue: 210, bio: "Dreamer. Builder. Coffee lover. ☕" },
  { id: "maya", name: "maya.codes", full: "Maya Chen", hue: 330, bio: "Frontend dev 💻 Cats and tea" },
  { id: "leo", name: "leo_travels", full: "Leo Alvarez", hue: 30, bio: "50 countries and counting 🌍" },
  { id: "zara", name: "zara.art", full: "Zara Khan", hue: 270, bio: "Painter. Colours are my language 🎨" },
  { id: "sam", name: "sam.eats", full: "Sam Okoye", hue: 130, bio: "Finding the best street food 🍜" },
  { id: "nina", name: "nina.fit", full: "Nina Rossi", hue: 180, bio: "Run. Lift. Repeat. 🏃‍♀️" },
  { id: "omar", name: "omar.shots", full: "Omar Haddad", hue: 50, bio: "Photographer 📷 Golden hours" },
];
const user = (id) => USERS.find((u) => u.id === id);
const CAPTIONS = ["Golden hour never disappoints ✨", "Weekend vibes 🌴", "New colours, new mood 🎨", "Worth the early alarm ☀️", "Just me and the horizon", "Found this hidden gem 💎", "Monday motivation 💪", "Dinner was unreal 🍜", "Take me back 🌊", "Simple things 🤍", "Lost in the moment", "Sunday reset"];
const FIRST = ["Love this!", "Wow 😍", "So good", "Where is this?", "Amazing colours!"];

const initialPosts = [];
for (let i = 0; i < 12; i++) {
  const u = USERS[1 + (i % 6)];
  initialPosts.push({
    id: i + 1, userId: u.id, img: photo(i + 3), caption: CAPTIONS[i],
    likes: 40 + ((i * 137) % 900), liked: false, saved: false,
    comments: [{ by: USERS[1 + ((i + 2) % 6)].name, text: FIRST[i % 5] }],
  });
}

/* ---------- 2. SMALL BUILDING BLOCKS ---------- */
const PATHS = {
  home: "M3 11l9-8 9 8v10h-6v-6H9v6H3z",
  search: "M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5",
  plus: "M4 4h16v16H4zM12 8v8M8 12h8",
  heart: "M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.5 12 21 12 21z",
  comment: "M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z",
  send: "M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z",
  bookmark: "M6 3h12v18l-6-4-6 4z",
  user: "M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 21c0-4 4-6 8-6s8 2 8 6",
  grid: "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",
  x: "M5 5l14 14M19 5L5 19",
};
function Icon({ n, size = 26, fill, color }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill ? (color || "currentColor") : "none"}
      stroke={color || "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d={PATHS[n]} />
    </svg>
  );
}
function Avatar({ u, size = 40 }) {
  return (
    <div className="av" style={{ width: size, height: size, fontSize: size * 0.42,
      background: `linear-gradient(135deg,hsl(${u.hue},80%,60%),hsl(${(u.hue + 50) % 360},80%,45%))` }}>
      {u.name[0].toUpperCase()}
    </div>
  );
}

/* ---------- 3. THE APP ---------- */
function App() {
  const [tab, setTab] = useState("home");          // which page is showing
  const [profileId, setProfileId] = useState("you"); // whose profile
  const [posts, setPosts] = useState(initialPosts);
  const [seen, setSeen] = useState({});            // stories already watched
  const [story, setStory] = useState(null);        // story being viewed
  const [commentsFor, setCommentsFor] = useState(null);
  const [openPost, setOpenPost] = useState(null);
  const [creating, setCreating] = useState(false);
  const [following, setFollowing] = useState({ maya: true });
  const [bio, setBio] = useState(USERS[0].bio);
  const [toast, setToast] = useState("");

  const say = (m) => { setToast(m); setTimeout(() => setToast(""), 1800); };
  const update = (id, fn) => setPosts((ps) => ps.map((p) => (p.id === id ? fn(p) : p)));
  const toggleLike = (id) => update(id, (p) => ({ ...p, liked: !p.liked, likes: p.likes + (p.liked ? -1 : 1) }));
  const likeOnly = (id) => update(id, (p) => (p.liked ? p : { ...p, liked: true, likes: p.likes + 1 }));
  const toggleSave = (id) => update(id, (p) => { say(p.saved ? "Removed from saved" : "Saved"); return { ...p, saved: !p.saved }; });
  const addComment = (id, text) => update(id, (p) => ({ ...p, comments: [...p.comments, { by: "you", text }] }));
  const share = (id) => say("Link copied (demo)");
  const goProfile = (id) => { setProfileId(id); setTab("profile"); window.scrollTo(0, 0); };
  const go = (t) => { if (t === "profile") setProfileId("you"); setTab(t); window.scrollTo(0, 0); };
  const current = (id) => posts.find((p) => p.id === id);

  const actions = { toggleLike, likeOnly, toggleSave, share, goProfile, openComments: setCommentsFor };

  return (
    <>
      {tab === "home" && <Home posts={posts} seen={seen} setStory={setStory} actions={actions} say={say} />}
      {tab === "search" && <Search posts={posts} goProfile={goProfile} setOpenPost={setOpenPost} />}
      {tab === "profile" && (
        <Profile id={profileId} posts={posts} following={following} bio={bio} setBio={setBio}
          toggleFollow={(id) => { setFollowing((f) => ({ ...f, [id]: !f[id] })); say(following[id] ? "Unfollowed" : "Following"); }}
          setOpenPost={setOpenPost} say={say} />
      )}

      <nav className="nav"><div>
        {[["home", "home"], ["search", "search"]].map(([t, ic]) => (
          <button key={t} aria-label={t} onClick={() => go(t)}><Icon n={ic} fill={tab === t && t === "home"} /></button>
        ))}
        <button aria-label="New post" onClick={() => setCreating(true)}><Icon n="plus" /></button>
        <button aria-label="Profile" onClick={() => go("profile")}>
          <div style={{ borderRadius: "50%", padding: 2, border: tab === "profile" && profileId === "you" ? "2px solid var(--fg)" : "2px solid transparent" }}>
            <Avatar u={USERS[0]} size={24} />
          </div>
        </button>
      </div></nav>

      {story && <StoryViewer start={story} onSeen={(id) => setSeen((s) => ({ ...s, [id]: true }))} onClose={() => setStory(null)} />}
      {commentsFor && <Comments post={current(commentsFor)} add={addComment} onClose={() => setCommentsFor(null)} />}
      {openPost && (
        <div className="sheet-bg" onClick={() => setOpenPost(null)}>
          <div className="sheet" style={{ maxHeight: "92vh" }} onClick={(e) => e.stopPropagation()}>
            <div className="list" style={{ padding: 0 }}>
              <PostCard p={current(openPost)} actions={{ ...actions, openComments: (id) => { setOpenPost(null); setCommentsFor(id); }, goProfile: (id) => { setOpenPost(null); goProfile(id); } }} />
            </div>
          </div>
        </div>
      )}
      {creating && (
        <Create onClose={() => setCreating(false)} onPost={(img, caption) => {
          setPosts((ps) => [{ id: Date.now(), userId: "you", img, caption: caption || "New post", likes: 0, liked: false, saved: false, comments: [] }, ...ps]);
          setCreating(false); setTab("home"); say("Posted!");
        }} />
      )}
      {toast && <div className="toast">{toast}</div>}
    </>
  );
}

/* ---------- 4. PAGES ---------- */
function Home({ posts, seen, setStory, actions, say }) {
  return (
    <>
      <div className="top">
        <span className="logo">Snapgram</span>
        <div style={{ display: "flex", gap: 16 }}>
          <button aria-label="Notifications" onClick={() => say("No new notifications")}><Icon n="heart" /></button>
          <button aria-label="Messages" onClick={() => say("Messages coming soon")}><Icon n="send" /></button>
        </div>
      </div>
      <div className="stories">
        {USERS.map((u) => (
          <button key={u.id} className="story" onClick={() => setStory(u.id)}>
            <div className={"ring" + (seen[u.id] ? " seen" : "")}><div><Avatar u={u} size={58} /></div></div>
            <span style={{ overflow: "hidden", textOverflow: "ellipsis", maxWidth: 64, whiteSpace: "nowrap" }}>{u.id === "you" ? "Your story" : u.name}</span>
          </button>
        ))}
      </div>
      {posts.map((p) => <PostCard key={p.id} p={p} actions={actions} />)}
    </>
  );
}

function PostCard({ p, actions }) {
  const u = user(p.userId);
  const [burst, setBurst] = useState(0);
  const lastTap = useRef(0);
  const tap = () => {            // double-tap the photo to like
    const now = Date.now();
    if (now - lastTap.current < 300) { actions.likeOnly(p.id); setBurst((b) => b + 1); }
    lastTap.current = now;
  };
  return (
    <article className="post">
      <button className="ph" onClick={() => actions.goProfile(u.id)}><Avatar u={u} size={34} />{u.name}</button>
      <div className="img" onClick={tap}>
        <img src={p.img} alt="" draggable="false" />
        {burst > 0 && <div className="pop" key={burst}><Icon n="heart" size={90} fill color="#fff" /></div>}
      </div>
      <div className="acts">
        <button aria-label="Like" onClick={() => actions.toggleLike(p.id)}><Icon n="heart" fill={p.liked} color={p.liked ? "#ed4956" : undefined} /></button>
        <button aria-label="Comment" onClick={() => actions.openComments(p.id)}><Icon n="comment" /></button>
        <button aria-label="Share" onClick={() => actions.share(p.id)}><Icon n="send" /></button>
        <span className="sp" />
        <button aria-label="Save" onClick={() => actions.toggleSave(p.id)}><Icon n="bookmark" fill={p.saved} /></button>
      </div>
      <div className="pad"><b>{p.likes.toLocaleString()} likes</b></div>
      <div className="pad"><b>{u.name}</b> {p.caption}</div>
      <button className="pad mut" onClick={() => actions.openComments(p.id)}>
        {p.comments.length ? `View all ${p.comments.length} comment${p.comments.length > 1 ? "s" : ""}` : "Add a comment…"}
      </button>
    </article>
  );
}

function Search({ posts, goProfile, setOpenPost }) {
  const [q, setQ] = useState("");
  const term = q.trim().toLowerCase();
  const people = term ? USERS.filter((u) => u.id !== "you" && (u.name + u.full).toLowerCase().includes(term)) : [];
  const shown = term ? posts.filter((p) => p.caption.toLowerCase().includes(term) || user(p.userId).name.includes(term)) : posts;
  return (
    <>
      <div className="top"><input placeholder="Search people or captions" value={q} onChange={(e) => setQ(e.target.value)} /></div>
      {people.map((u) => (
        <button key={u.id} className="ph" style={{ width: "100%" }} onClick={() => goProfile(u.id)}>
          <Avatar u={u} size={44} />
          <span style={{ textAlign: "left" }}>{u.name}<div className="mut" style={{ fontWeight: 400, fontSize: 13 }}>{u.full}</div></span>
        </button>
      ))}
      {term && !people.length && !shown.length && <p className="mut" style={{ textAlign: "center", marginTop: 40 }}>No results for “{q}”</p>}
      <div className="grid" style={{ marginTop: 2 }}>
        {shown.map((p) => <button key={p.id} onClick={() => setOpenPost(p.id)}><img src={p.img} alt="" /></button>)}
      </div>
    </>
  );
}

function Profile({ id, posts, following, bio, setBio, toggleFollow, setOpenPost, say }) {
  const u = user(id), mine = id === "you";
  const [view, setView] = useState("posts");
  const [editing, setEditing] = useState(false);
  const list = view === "saved" ? posts.filter((p) => p.saved) : posts.filter((p) => p.userId === id);
  const followers = 1200 + id.length * 311 + (following[id] ? 1 : 0);
  return (
    <>
      <div className="top"><b>{u.name}</b><button aria-label="Menu" onClick={() => say("Settings coming soon")}>☰</button></div>
      <div style={{ display: "flex", alignItems: "center", gap: 16, padding: "16px 14px 8px" }}>
        <Avatar u={u} size={84} />
        <div className="stats">
          <div><b>{posts.filter((p) => p.userId === id).length}</b>posts</div>
          <div><b>{followers.toLocaleString()}</b>followers</div>
          <div><b>{mine ? 180 : 312}</b>following</div>
        </div>
      </div>
      <div className="pad"><b>{u.full}</b>
        {editing ? <input value={bio} onChange={(e) => setBio(e.target.value)} style={{ width: "100%", marginTop: 6 }} /> : <div>{mine ? bio : u.bio}</div>}
      </div>
      <div className="pad" style={{ display: "flex", gap: 8, marginTop: 12 }}>
        {mine ? (
          <button className="btn alt" style={{ flex: 1 }} onClick={() => setEditing(!editing)}>{editing ? "Save" : "Edit profile"}</button>
        ) : (
          <>
            <button className={"btn" + (following[id] ? " alt" : "")} style={{ flex: 1 }} onClick={() => toggleFollow(id)}>{following[id] ? "Following" : "Follow"}</button>
            <button className="btn alt" style={{ flex: 1 }} onClick={() => say("Messages coming soon")}>Message</button>
          </>
        )}
      </div>
      <div className="tabs">
        <button className={view === "posts" ? "on" : ""} onClick={() => setView("posts")}><Icon n="grid" size={22} /></button>
        {mine && <button className={view === "saved" ? "on" : ""} onClick={() => setView("saved")}><Icon n="bookmark" size={22} /></button>}
      </div>
      {list.length ? (
        <div className="grid">{list.map((p) => <button key={p.id} onClick={() => setOpenPost(p.id)}><img src={p.img} alt="" /></button>)}</div>
      ) : <p className="mut" style={{ textAlign: "center", marginTop: 40 }}>{view === "saved" ? "Tap the bookmark on a post to save it." : "No posts yet. Tap + to share one!"}</p>}
    </>
  );
}

/* ---------- 5. POP-UPS ---------- */
function StoryViewer({ start, onSeen, onClose }) {
  const [i, setI] = useState(USERS.findIndex((u) => u.id === start));
  const u = USERS[i];
  useEffect(() => {
    onSeen(u.id);
    const t = setTimeout(() => (i < USERS.length - 1 ? setI(i + 1) : onClose()), 4000);
    return () => clearTimeout(t);
  }, [i]);
  const tap = (e) => {
    const x = e.clientX - e.currentTarget.getBoundingClientRect().left;
    if (x < e.currentTarget.offsetWidth / 3) setI(Math.max(0, i - 1));
    else i < USERS.length - 1 ? setI(i + 1) : onClose();
  };
  return (
    <div className="viewer"><div className="vin" onClick={tap}>
      <img src={photo(i * 5 + 100)} alt="" />
      <div className="bars">{USERS.map((_, k) => <i key={k + "-" + i} className={k === i ? "on" : ""}>{k < i && <b style={{ width: "100%" }} />}{k === i && <b />}</i>)}</div>
      <div className="vh"><Avatar u={u} size={32} /><span style={{ flex: 1 }}>{u.name}</span>
        <button aria-label="Close" onClick={(e) => { e.stopPropagation(); onClose(); }}><Icon n="x" /></button></div>
    </div></div>
  );
}

function Comments({ post, add, onClose }) {
  const [t, setT] = useState("");
  const send = () => { if (t.trim()) { add(post.id, t.trim()); setT(""); } };
  return (
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <h3>Comments</h3>
        <div className="list">
          <div className="cm"><Avatar u={user(post.userId)} size={32} /><div><b>{user(post.userId).name}</b> {post.caption}</div></div>
          {post.comments.map((c, k) => {
            const cu = USERS.find((x) => x.name === c.by) || USERS[0];
            return <div className="cm" key={k}><Avatar u={cu} size={32} /><div><b>{c.by}</b> {c.text}</div></div>;
          })}
        </div>
        <div className="row">
          <input placeholder="Add a comment…" value={t} onChange={(e) => setT(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} />
          <button className="btn" onClick={send}>Post</button>
        </div>
      </div>
    </div>
  );
}

function Create({ onClose, onPost }) {
  const [pick, setPick] = useState(20);
  const [cap, setCap] = useState("");
  return (
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" style={{ maxHeight: "92vh" }} onClick={(e) => e.stopPropagation()}>
        <h3>New post</h3>
        <div className="list" style={{ padding: 0 }}>
          <div className="swatches">
            {[20, 21, 22, 23, 24, 25].map((n) => <button key={n} className={pick === n ? "on" : ""} onClick={() => setPick(n)}><img src={photo(n)} alt="" /></button>)}
          </div>
          <div style={{ padding: "0 14px 14px" }}><textarea rows="3" placeholder="Write a caption…" value={cap} onChange={(e) => setCap(e.target.value)} /></div>
        </div>
        <div className="row"><button className="btn alt" onClick={onClose}>Cancel</button><button className="btn" style={{ flex: 1 }} onClick={() => onPost(photo(pick), cap)}>Share</button></div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
